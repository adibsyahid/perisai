name: perisai
description: "PERISAI: AI-powered family anti-scam app for Malaysia."
publish_to: 'none'

# In Android, build-name is versionName and build-number is versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.5+1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  # flutter_localizations pins its own intl version, so we accept whatever it picks.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from the ARB files listed in l10n.yaml.
  generate: true
